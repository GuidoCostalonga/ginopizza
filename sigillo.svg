<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="tsigillo">
  <title id="tsigillo">Sigillo GinoPizza: Repubblica delle cose fatte, ginopizza.it, 1994-2026</title>
  <defs>
    <path id="arcoSopra" d="M 100,100 m -74,0 a 74,74 0 1 1 148,0" fill="none"/>
    <path id="arcoSotto" d="M 100,100 m -66,0 a 66,66 0 1 0 132,0" fill="none"/>
  </defs>

  <!-- Fondo e corona dentellata -->
  <circle cx="100" cy="100" r="98" fill="#ffffff"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#000000" stroke-width="6" stroke-dasharray="5 5"/>
  <circle cx="100" cy="100" r="87" fill="#0038ff"/>
  <circle cx="100" cy="100" r="87" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="100" cy="100" r="81" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="100" cy="100" r="56" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Testo ad arco -->
  <g font-family="Oswald, Impact, 'Arial Narrow', sans-serif" font-weight="700" fill="#ffffff">
    <text font-size="11" letter-spacing="1.1">
      <textPath href="#arcoSopra" startOffset="50%" text-anchor="middle">REPUBBLICA DELLE COSE FATTE</textPath>
    </text>
    <text font-size="10" letter-spacing="1">
      <textPath href="#arcoSotto" startOffset="50%" text-anchor="middle">★ GINOPIZZA.IT ★ 1994-2026 ★</textPath>
    </text>
  </g>

  <!-- Stemma centrale: stivale della Protezione Civile incrociato con il trancio di pizza -->
  <g transform="translate(100 100)">

    <!-- Stivale, dietro, inclinato a destra -->
    <g transform="translate(15 -3) rotate(24) scale(0.8)">
      <path d="M -8,-40 L 7,-40 L 7,12 L 25,12 L 25,26 L -8,26 Z" fill="#000000"/>
      <rect x="-11" y="24" width="39" height="9" fill="#0038ff" stroke="#000000" stroke-width="3"/>
      <rect x="-8" y="-33" width="15" height="4.5" fill="#ffffff"/>
      <rect x="-8" y="-23" width="15" height="4.5" fill="#ffffff"/>
      <rect x="-8" y="-13" width="15" height="4.5" fill="#ffffff"/>
    </g>

    <!-- Trancio di pizza, davanti, inclinato a sinistra -->
    <g transform="translate(-14 2) rotate(-24) scale(0.84)">
      <path d="M 0,34 L -20,-22 L 20,-22 Z" fill="#facc15" stroke="#000000" stroke-width="3.6" stroke-linejoin="round"/>
      <path d="M -20,-22 A 28,28 0 0 1 20,-22 Z" fill="#ffffff" stroke="#000000" stroke-width="3.6" stroke-linejoin="round"/>
      <circle cx="-6" cy="4" r="4.2" fill="#dc2626" stroke="#000000" stroke-width="2"/>
      <circle cx="7" cy="-6" r="4.2" fill="#dc2626" stroke="#000000" stroke-width="2"/>
      <circle cx="1" cy="18" r="3.4" fill="#dc2626" stroke="#000000" stroke-width="2"/>
    </g>
  </g>
</svg>
